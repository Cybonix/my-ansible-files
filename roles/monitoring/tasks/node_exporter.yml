---
# Node Exporter Installation for Prometheus

- name: Download Node Exporter
  get_url:
    url: "{{ node_exporter_download_url }}"
    dest: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    mode: '0644'

- name: Extract Node Exporter
  unarchive:
    src: "/tmp/node_exporter-{{ node_exporter_version }}.tar.gz"
    dest: /tmp
    remote_src: yes
    creates: "/tmp/node_exporter-{{ node_exporter_version }}"

- name: Copy Node Exporter binary
  copy:
    src: "/tmp/node_exporter-{{ node_exporter_version }}/node_exporter"
    dest: "{{ node_exporter_bin_dir }}/node_exporter"
    owner: "{{ prometheus_user }}"
    group: "{{ prometheus_group }}"
    mode: '0755'
    remote_src: yes
  notify: restart node exporter

- name: Create Node Exporter systemd service
  template:
    src: node_exporter.service.j2
    dest: /etc/systemd/system/node_exporter.service
    mode: '0644'
  notify:
    - reload systemd
    - restart node exporter

- name: Start and enable Node Exporter service
  service:
    name: node_exporter
    state: started
    enabled: yes

- name: Test Node Exporter connectivity
  uri:
    url: "http://{{ ansible_default_ipv4.address }}:{{ node_exporter_port }}/metrics"
    method: GET
    return_content: yes
  register: node_exporter_test
  failed_when: false
  changed_when: false