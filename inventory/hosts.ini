# Web Servers
[webservers]
web1.lab ansible_host=192.168.1.20
web2.lab ansible_host=192.168.1.21
nginx1.lab ansible_host=192.168.1.22

# Database Servers
[dbservers]
db1.lab ansible_host=192.168.1.30
mariadb1.lab ansible_host=192.168.1.31
postgres1.lab ansible_host=192.168.1.32

# DNS Servers
[dns_servers]
dns1.lab ansible_host=192.168.1.40
dns2.lab ansible_host=192.168.1.41

# Monitoring Servers
[monitoring_servers]
monitor1.lab ansible_host=192.168.1.50

# Kubernetes Cluster
[k8s_masters]
k8s-master1.lab ansible_host=192.168.1.60
k8s-master2.lab ansible_host=192.168.1.61

[k8s_workers]
k8s-worker1.lab ansible_host=192.168.1.65
k8s-worker2.lab ansible_host=192.168.1.66
k8s-worker3.lab ansible_host=192.168.1.67

[k8s_nodes:children]
k8s_masters
k8s_workers

# Operating System Groups
[rocky_linux]
rocky1.lab ansible_host=192.168.1.10
web1.lab
db1.lab
dns1.lab
k8s-master1.lab
k8s-worker1.lab

[ubuntu_servers]
ubuntu1.lab ansible_host=192.168.1.11
web2.lab
postgres1.lab
monitor1.lab
k8s-master2.lab
k8s-worker2.lab

[alma_linux]
alma1.lab ansible_host=192.168.1.12
nginx1.lab
mariadb1.lab
dns2.lab
k8s-worker3.lab

# Legacy lab VMs (for backward compatibility)
[labvms]
rocky1.lab
ubuntu1.lab
alma1.lab

# Service Groups for Complex Deployments
[lamp_stack]
web1.lab
db1.lab

[lemp_stack]
nginx1.lab
mariadb1.lab

# Production-like environments
[production]
web1.lab
web2.lab
db1.lab
postgres1.lab
dns1.lab
dns2.lab

[development]
rocky1.lab
ubuntu1.lab
alma1.lab

[staging]
monitor1.lab
nginx1.lab
mariadb1.lab

# Global Variables
[all:vars]
ansible_user=your_ssh_user # Replace with your actual SSH username
ansible_ssh_private_key_file=~/.ssh/id_rsa # Replace with your actual private key path
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
ansible_python_interpreter=/usr/bin/python3
